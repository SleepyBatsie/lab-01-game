name: CI & Deploy
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build:client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build & verify Docker (< 200 MB, non-root, SIGTERM < 10s)
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t space-arena:ci .
          SIZE_MB=$(( $(docker image inspect space-arena:ci --format='{{.Size}}') / 1024 / 1024 ))
          echo "Size: ${SIZE_MB} MB" && test "$SIZE_MB" -lt 200
          docker run -d --name verify -p 3000:3000 -e BUILD_SHA=${{ github.sha }} space-arena:ci
          sleep 2
          test "$(docker exec verify whoami)" = "node"
          curl -fsS http://127.0.0.1:3000/health | grep -q "${{ github.sha }}"
          curl -fsS http://127.0.0.1:3000/ready | grep -q '"ready":true'
          curl -fsS http://127.0.0.1:3000/metrics | grep -q "game_active_rooms"
          T0=$(date +%s); docker stop verify; ELAPSED=$(( $(date +%s) - T0 ))
          echo "Stop time: ${ELAPSED}s" && test "$ELAPSED" -lt 10
          docker rm verify
  publish-and-deploy:
    needs: test-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/space-arena:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/space-arena:latest
      - env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"; fi
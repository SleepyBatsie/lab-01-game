<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 01: Event Loop & Game Loop</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #111;
        color: #eee;
        font-family: monospace;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #game-container { position: relative; }
      canvas { display: block; background: #050508; }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.75);
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 14px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="canvas"></canvas>
      <div id="hud">
        FPS: <span id="fps">0</span> | Steps/s: <span id="sps">0</span> | Frame time: <span id="frame-time">0</span> ms
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
